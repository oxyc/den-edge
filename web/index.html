<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0f" />
    <!-- What a shared link shows, and what the tab says before the app has run.
         den-edge replaces everything between the two markers per page (src/meta.rs): a title's link carries
         its own name, year, overview and artwork, because the things that build a link preview — Slack,
         iMessage, a crawler — run no JavaScript, and would otherwise unfurl every page as "Den" with a
         generic picture. What is written here is the fallback, and what every other page keeps. -->
    <!--den:meta-->
    <title>Den</title>
    <meta
      name="description"
      content="Your Den library: discover movies and series, keep track of what you watch, and pick up where you left off."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Den" />
    <meta property="og:title" content="Den" />
    <meta
      property="og:description"
      content="Your Den library: discover movies and series, keep track of what you watch, and pick up where you left off."
    />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <!--/den:meta-->
    <!-- The tab icon is the mark's arch alone, following the viewer's colour scheme; the PNG is for browsers that
         take no SVG icon. Generated by den's `make icon` (docs/brand/web/) and copied here, not drawn by hand. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <!-- Installable, so Den can be kept on a home screen or in a dock rather than as a tab. That also matters
         for Safari, which clears a site's storage after a week unused unless it is installed — and for Den
         that would mean pairing again. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Every page draws posters from here, a visitor's too: the connection opens while the app still loads. -->
    <link rel="preconnect" href="https://image.tmdb.org" />
    <!-- The retained lead can paint before any application CSS or JavaScript arrives. This frame has the live
         billboard's initial geometry; it is absolute because the application will supply the page's real flow. -->
    <style data-den-early-billboard-style>
      [data-den-early-billboard][hidden] {
        display: none;
      }

      [data-den-early-billboard] {
        position: absolute;
        z-index: 0;
        top: 0;
        left: 0;
        width: 100vw;
        height: clamp(420px, 76vh, 860px);
        overflow: hidden;
        background: #0b0b0f;
        pointer-events: none;
      }

      [data-den-early-picture] {
        position: absolute;
        inset: 0;
        contain: layout;
        transform: scale(1.14);
      }

      /* The live picture's scroll-linked drift starts here too. Matching its first transform keeps the exact
           retained image node still when the component adopts it; reduced-motion and unsupported browsers use
           the unshifted fallback in both places. */
      @supports (animation-timeline: --rail) {
        @media not (prefers-reduced-motion: reduce) {
          [data-den-early-picture] {
            transform: translate3d(2.5%, 0, 0) scale(1.14);
          }
        }
      }

      [data-den-early-backdrop] {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0;
        transition: opacity 0.55s ease;
        -webkit-user-drag: none;
      }

      [data-den-early-backdrop].lit {
        opacity: 1;
      }

      [data-den-early-scrim],
      [data-den-early-fade] {
        position: absolute;
        right: 0;
        left: 0;
      }

      [data-den-early-scrim] {
        top: 0;
        bottom: 0;
        background: linear-gradient(
          to bottom,
          rgb(0 0 0 / 0.55),
          rgb(0 0 0 / 0.15) 30%,
          transparent 55%
        );
      }

      [data-den-early-copy][hidden] {
        display: none;
      }

      [data-den-early-copy] {
        position: absolute;
        z-index: 3;
        inset: 0;
        display: grid;
        align-items: end;
        color: #e7e7ea;
        font:
          16px/1.4 -apple-system,
          BlinkMacSystemFont,
          'SF Pro Text',
          'Segoe UI',
          Roboto,
          sans-serif;
        pointer-events: none;
        -webkit-font-smoothing: antialiased;
      }

      [data-den-early-told] {
        box-sizing: border-box;
        width: 100%;
        max-width: 1400px;
        margin: 0 auto;
        padding: calc(max(12px, env(safe-area-inset-top)) + 62px) clamp(16px, 4vw, 48px) 76px;
      }

      [data-den-early-text] {
        display: grid;
        gap: 8px;
        max-width: 720px;
        min-height: 190px;
        align-content: end;
      }

      [data-den-early-title],
      [data-den-early-reason],
      [data-den-early-facts],
      [data-den-early-overview] {
        filter: drop-shadow(0 1px 2px rgb(0 0 0 / 0.8));
      }

      [data-den-early-title] {
        max-block-size: 2.4em;
        display: -webkit-box;
        margin: 0;
        overflow: hidden;
        font-size: clamp(26px, 6vw, 48px);
        line-height: 1.05;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        line-clamp: 2;
      }

      [data-den-early-reason],
      [data-den-early-facts] {
        margin: 0;
        color: rgb(255 255 255 / 0.92);
        font-size: 14px;
        line-height: 1.4;
      }

      [data-den-early-reason] {
        font-weight: 600;
      }

      [data-den-early-facts] {
        max-block-size: 2.8em;
        display: -webkit-box;
        overflow: hidden;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        line-clamp: 2;
      }

      [data-den-early-overview] {
        min-block-size: 4.2em;
        max-block-size: 4.2em;
        display: -webkit-box;
        margin: 0;
        overflow: hidden;
        color: rgb(255 255 255 / 0.88);
        font-size: 15px;
        line-height: 1.4;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 3;
        line-clamp: 3;
      }

      [data-den-early-actions] {
        /* The live controls may occupy a second 48px row. Reserve both rows before hydration so adding the
             library actions cannot lift the retained title and overview by one control row. */
        height: 106px;
        margin-top: 4px;
      }

      [data-den-early-fade] {
        bottom: 0;
        height: 62%;
        background: linear-gradient(
          to bottom,
          rgb(11 11 15 / 0) 0%,
          rgb(11 11 15 / 0.013) 12.5%,
          rgb(11 11 15 / 0.104) 25%,
          rgb(11 11 15 / 0.259) 37.5%,
          rgb(11 11 15 / 0.5) 50%,
          rgb(11 11 15 / 0.742) 62.5%,
          rgb(11 11 15 / 0.897) 75%,
          rgb(11 11 15) 100%
        );
      }

      @supports (height: 1lvh) {
        [data-den-early-billboard] {
          height: clamp(420px, 76lvh, 860px);
        }
      }

      @media (width >= 1000px) {
        [data-den-early-billboard] {
          height: max(clamp(420px, 76vh, 860px), min(56.25vw, 94vh));
        }

        @supports (height: 1lvh) {
          [data-den-early-billboard] {
            height: max(clamp(420px, 76lvh, 860px), min(56.25vw, 94lvh));
          }
        }
      }

      @media (width <= 759px) {
        [data-den-early-text] {
          min-height: 0;
        }

        [data-den-early-actions] {
          display: none;
        }
      }

      @media (width >= 360px) and (width <= 759px) {
        [data-den-early-title] {
          max-block-size: 1.3em;
          -webkit-line-clamp: 1;
          line-clamp: 1;
        }
      }
    </style>
    <!-- A return visit can name its exact kept personalized lead without opening the encrypted library. Run this
         before the module graph: the image request then overlaps the app download instead of starting after it.
         The CSP permits only this script's hash; changing these bytes also requires changing src/web.rs. -->
    <script data-den-early-hero>
      void (() => {
        try {
          const fragment = location.hash.replace(/^#/, '');
          const [legacyPage, ...legacyRest] = fragment.split('/');
          const legacyId = (part) => {
            const digits = /^(\d+)(?:-[^/]*)?$/.exec(part ?? '')?.[1];
            const id = Number(digits);
            return digits !== undefined && Number.isInteger(id) && id > 0;
          };
          const legacy =
            fragment &&
            !fragment.includes('=') &&
            (legacyPage === 'library' ||
              legacyPage === 'search' ||
              (['movies', 'series', 'watchlist', 'downloads', 'settings'].includes(legacyPage) &&
                legacyRest.length === 0) ||
              (legacyPage === 'title' &&
                (legacyRest[0] === 'movie' || legacyRest[0] === 'tv') &&
                legacyId(legacyRest[1])) ||
              (legacyPage === 'person' && legacyId(legacyRest[0])));
          // main.ts turns these old fragment routes into paths. Do not briefly warm Home before that rewrite;
          // pairing and invite fragments contain `=` and deliberately remain Home.
          if (legacy) return;
          const facet =
            location.pathname === '/'
              ? 'all'
              : location.pathname === '/movies'
                ? 'movie'
                : location.pathname === '/series'
                  ? 'tv'
                  : null;
          if (!facet) return;
          const switchOn = (name, parameter) => {
            const asked = new URLSearchParams(location.search).get(parameter);
            try {
              if (asked === '1' || asked === '0') localStorage.setItem(name, asked);
              return localStorage.getItem(name) !== '0';
            } catch {
              return asked !== '0';
            }
          };
          const fresh = switchOn('den.billboard.fresh', 'billboard-fresh');
          if (!switchOn('den.billboard.member-post', 'billboard-post')) return;
          const links = JSON.parse(localStorage.getItem('den.links') ?? '[]');
          const linked = Array.isArray(links)
            ? links.find(
                (value) =>
                  value &&
                  typeof value.inboxKey === 'string' &&
                  /^[0-9a-f]{16,}$/i.test(value.inboxKey) &&
                  typeof value.libraryKey === 'string' &&
                  typeof value.linkKey === 'string' &&
                  (value.deviceId === undefined || /^[0-9a-f]{16}$/.test(value.deviceId)) &&
                  (value.sentIdentityName === undefined ||
                    typeof value.sentIdentityName === 'string') &&
                  (value.sentIdentityDeviceId === undefined ||
                    /^[0-9a-f]{16}$/.test(value.sentIdentityDeviceId)),
              )
            : undefined;
          const identity =
            linked?.libraryKey ??
            (localStorage.getItem('den.browsing') === '1'
              ? localStorage.getItem('den.localLibrary')
              : null);
          if (!identity) return;
          const suffix = `${fresh ? 'fresh.' : ''}${facet}`;
          const pointerName = `den.hero-lead.current.v1.${suffix}`;
          let pointer;
          try {
            pointer = JSON.parse(localStorage.getItem(pointerName) ?? 'null');
          } catch {
            localStorage.removeItem(pointerName);
            return;
          }
          if (
            !pointer ||
            pointer.identity !== identity ||
            typeof pointer.key !== 'string' ||
            !/^den\.hero-lead\.v1\.[0-9a-f]{64}\.(?:fresh\.)?(?:all|movie|tv)$/.test(pointer.key) ||
            !pointer.key.endsWith(`.${suffix}`)
          ) {
            localStorage.removeItem(pointerName);
            return;
          }
          const key = pointer.key;
          const raw = localStorage.getItem(key);
          const kept = raw ? JSON.parse(raw) : null;
          const age = Date.now() - (kept?.at ?? NaN);
          if (
            !kept ||
            typeof kept.path !== 'string' ||
            !/^\/[A-Za-z0-9_./-]+$/.test(kept.path) ||
            !(age >= 0 && age < 7 * 86_400_000)
          ) {
            if (raw) localStorage.removeItem(key);
            localStorage.removeItem(pointerName);
            return;
          }
          const bounded = (value, max) =>
            typeof value === 'string' && value.length > 0 && value.length <= max
              ? value
              : undefined;
          const optionalText = (value, max) =>
            value === undefined ? undefined : (bounded(value, max) ?? null);
          const copyOf = (value) => {
            if (!value || typeof value !== 'object') return null;
            const title = bounded(value.title, 160);
            const reason = optionalText(value.reason, 100);
            const overview = optionalText(value.overview, 1024);
            const year =
              value.year === undefined ||
              (Number.isInteger(value.year) && value.year >= 1888 && value.year <= 2200)
                ? value.year
                : null;
            const runtime =
              value.runtime === undefined ||
              (Number.isInteger(value.runtime) && value.runtime > 0 && value.runtime <= 1440)
                ? value.runtime
                : null;
            const genres = value.genres ?? [];
            if (
              !title ||
              (value.type !== 'movie' && value.type !== 'tv') ||
              !Number.isInteger(value.id) ||
              value.id <= 0 ||
              reason === null ||
              overview === null ||
              year === null ||
              runtime === null ||
              !Array.isArray(genres) ||
              genres.length > 2 ||
              genres.some((genre) => !bounded(genre, 60))
            )
              return null;
            return { title, reason, overview, year, runtime, genres };
          };
          const copy = copyOf(kept.copy);
          const preload = document.createElement('link');
          const image = (size) => `https://image.tmdb.org/t/p/${size}${kept.path}`;
          preload.rel = 'preload';
          preload.as = 'image';
          preload.fetchPriority = 'high';
          preload.imageSrcset = `${image('w300')} 300w, ${image('w780')} 780w, ${image('w1280')} 1280w`;
          preload.imageSizes = '100vw';
          preload.href = image('w1280');
          document.head.append(preload);
          const place = () => {
            const shell = document.querySelector('[data-den-early-billboard]');
            const backdrop = shell?.querySelector('[data-den-early-backdrop]');
            if (!(shell instanceof HTMLElement) || !(backdrop instanceof HTMLImageElement))
              return false;
            backdrop.dataset.path = kept.path;
            backdrop.fetchPriority = 'high';
            backdrop.sizes = '100vw';
            backdrop.srcset = preload.imageSrcset;
            backdrop.src = preload.href;
            const words = shell.querySelector('[data-den-early-copy]');
            if (copy && words instanceof HTMLElement) {
              const title = words.querySelector('[data-den-early-title]');
              const reason = words.querySelector('[data-den-early-reason]');
              const facts = words.querySelector('[data-den-early-facts]');
              const overview = words.querySelector('[data-den-early-overview]');
              if (title) title.textContent = copy.title;
              if (reason) {
                reason.textContent = copy.reason ?? '';
                reason.hidden = !copy.reason;
              }
              if (facts)
                facts.textContent = [copy.year, ...copy.genres].filter(Boolean).join(' · ');
              if (overview) overview.textContent = copy.overview ?? '';
              words.dataset.path = kept.path;
              words.dataset.detail = copy.overview || copy.genres.length ? 'true' : 'false';
              words.hidden = false;
            }
            shell.hidden = false;
            window.dispatchEvent(new Event('den:early-hero'));
            return true;
          };
          if (!place()) {
            const observer = new MutationObserver(() => {
              if (place()) observer.disconnect();
            });
            observer.observe(document.documentElement, {
              childList: true,
              subtree: true,
            });
          }
        } catch {
          // Storage and Web Crypto can be unavailable; ordinary billboard loading remains the fallback.
        }
      })();
    </script>
  </head>
  <body>
    <!-- Empty in the shared shell: the parser-time script fills this only from the validated retained lead hint.
         Billboard moves the same image node into its live picture layer, so app startup cannot reset LCP by
         replacing an already-painted image with an identical one. -->
    <div data-den-early-billboard hidden aria-hidden="true">
      <div data-den-early-picture>
        <img class="lit" data-den-early-backdrop alt="" decoding="async" draggable="false" />
      </div>
      <div data-den-early-scrim></div>
      <div data-den-early-fade></div>
      <div data-den-early-copy hidden inert aria-hidden="true">
        <div data-den-early-told>
          <div data-den-early-text>
            <h2 data-den-early-title></h2>
            <p data-den-early-reason hidden></p>
            <p data-den-early-facts></p>
            <p data-den-early-overview></p>
            <div data-den-early-actions></div>
          </div>
        </div>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
