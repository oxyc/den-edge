<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The receiver to launch: den-edge writes `CAST_APP_ID` here (`src/cast.rs`); empty is Google's Default Media
         Receiver. -->
    <meta name="den-cast-app" content="" />
    <title>Den Cast</title>
  </head>
  <body>
    <!-- The output buttons, Cast and AirPlay. Away from home the player draws its own transport over this page and
         leaves a hole in its top bar for them (`den-outputs-slot`); they are placed in it. -->
    <div class="outputs">
      <!-- The Cast button. The press that opens Chrome's device list has to happen in this page, since a press in the
           player does not reach into this cross-origin frame: in the player's control bar this page is only this button
           (`html.button`), drawn over the player's own button surface. main.ts shows it once the Cast SDK has found a
           receiver (Chromium only; Safari has AirPlay instead). -->
      <button id="cast" class="cast-button" type="button" aria-label="Cast to a TV" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path class="screen" d="M2 8V6a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-6" />
          <path class="fill" d="M6 8h12v8h-3.4A12.5 12.5 0 0 0 6 8.8Z" />
          <path class="arc arc-outer" d="M2 12a9 9 0 0 1 8 8" />
          <path class="arc arc-inner" d="M2 16a5 5 0 0 1 4 4" />
          <path class="arc arc-dot" d="M2 20h.01" />
        </svg>
      </button>
      <!-- AirPlay, where this page plays the session itself: Safari opens its device list only from a press on the
           element that plays, and that element is here. Shown while Safari says a device is on the network. -->
      <button id="airplay" class="airplay-button" type="button" aria-label="AirPlay" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M4 16.5a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-3" />
          <path d="m12 13-5 7h10l-5-7Z" />
        </svg>
      </button>
    </div>
    <!-- Fullscreen on an iPhone, where only a video can fill the screen (`webkitEnterFullscreen`) and only a press in
         the document that holds it may ask: the player's own button cannot reach this frame's video. It sits in the
         hole the player leaves where its own fullscreen button is, in its bottom dock (`den-outputs-slot`). -->
    <button id="fullscreen" class="fullscreen-button" type="button" aria-label="Fullscreen" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M9 4H4v5m11-5h5v5M9 20H4v-5m11 5h5v-5" />
      </svg>
    </button>
    <main>
      <video playsinline x-webkit-airplay="allow"></video>
      <button id="play-local" class="play-local" type="button" hidden>Play</button>
      <div class="overlay">
        <span id="status" class="pill" role="status" hidden></span>
      </div>
    </main>
    <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
