<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Den Cast</title>
  </head>
  <body>
    <main>
      <video controls playsinline x-webkit-airplay="allow"></video>
      <div class="overlay">
        <span id="status" class="pill" role="status" hidden></span>
        <!-- Both are revealed by main.ts: the launcher only where the Cast SDK exists (Chromium; Safari has AirPlay
             instead and would draw an empty circle), the receiver menu only while a Cast session is connected. -->
        <google-cast-launcher
          aria-label="Cast to a TV"
          title="Cast to a TV"
          hidden
        ></google-cast-launcher>
        <details class="cast-options" hidden>
          <summary aria-label="Cast options" title="Cast options">⋯</summary>
          <label>
            <span>Receiver</span>
            <select id="profile">
              <option value="legacy">Chromecast 1–2</option>
              <option value="gen3">Chromecast 3</option>
              <option value="ultra">Chromecast Ultra</option>
              <option value="google-tv-hd">Chromecast with Google TV (HD)</option>
              <option value="google-tv-4k">Chromecast with Google TV (4K)</option>
              <option value="streamer">Google TV Streamer</option>
            </select>
          </label>
        </details>
      </div>
    </main>
    <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
