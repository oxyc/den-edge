<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Den Cast</title>
  </head>
  <body>
    <!-- The Cast button. The press that opens Chrome's device list has to happen in this page, since a press in the
         player does not reach into this cross-origin frame: in the player's control bar this page is only this button
         (`html.button`), drawn over the player's own button surface. main.ts shows it once the Cast SDK has found a
         receiver (Chromium only; Safari has AirPlay instead). -->
    <button id="cast" class="cast-button" type="button" aria-label="Cast to a TV" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path class="screen" d="M2 8V6a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-6" />
        <path class="fill" d="M6 8h12v8h-3.4A12.5 12.5 0 0 0 6 8.8Z" />
        <path class="arc arc-outer" d="M2 12a9 9 0 0 1 8 8" />
        <path class="arc arc-inner" d="M2 16a5 5 0 0 1 4 4" />
        <path class="arc arc-dot" d="M2 20h.01" />
      </svg>
    </button>
    <main>
      <video controls playsinline x-webkit-airplay="allow"></video>
      <div class="overlay">
        <span id="status" class="pill" role="status" hidden></span>
      </div>
    </main>
    <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
