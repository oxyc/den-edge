name: stress-1184

# TEMPORARY: reproduces the settings-startup-policy flake. Removed before the fix is proposed.
on:
  push:
    branches: [fix/flake-1184-startup-policy]

permissions:
  contents: read

jobs:
  stress:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { workers: 1, load: 0, copy: a }
          - { workers: 4, load: 0, copy: a }
          - { workers: 4, load: 0, copy: b }
          - { workers: 2, load: 2, copy: a }
          - { workers: 4, load: 4, copy: a }
          - { workers: 4, load: 4, copy: b }
    name: stress w${{ matrix.workers }} load${{ matrix.load }} ${{ matrix.copy }}
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Stress
        shell: bash
        env:
          HOME: /root
          LOAD: ${{ matrix.load }}
        run: |
          for i in $(seq 1 "$LOAD"); do (while :; do :; done) > /dev/null 2>&1 & done
          npx playwright test e2e/settings-startup-policy.spec.mjs --repeat-each=30 --workers=${{ matrix.workers }} | tee stress.log
      - name: Timelines
        if: always()
        run: grep -A 60 TIMELINE-1184 stress.log || true
      - name: Retain failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: stress-failures-w${{ matrix.workers }}-load${{ matrix.load }}-${{ matrix.copy }}
          path: web/test-results
          if-no-files-found: ignore
          retention-days: 3
