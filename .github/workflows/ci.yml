name: ci

# Every exact main commit produces a scanned, immutable candidate image while its checks run. A release tag only
# promotes those already-tested digests; it never recompiles or reruns this workflow.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Superseded PR revisions are disposable. A main SHA is a potential release and its candidate must finish even
  # when another merge follows it, otherwise a tag could name a commit whose exact image was cancelled midway.
  # Main therefore gets one group per SHA: within a shared group GitHub keeps one running and one pending run and
  # cancels the older pending run when a third queues, even with cancel-in-progress off. On 2026-11-08 that
  # cancelled three queued main runs (c638c71e, fe342785, ba316297) behind #1104's, and release 0.271.208 failed
  # on "exact-main CI … finished cancelled".
  group: ci-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/${{ github.repository_owner }}/den-edge

jobs:
  # Test a source tree once. When a ci.yml run in this repository already passed every blocking test job on
  # byte-identical source (the commit's tree without VERSION; see scripts/ci-verdict.sh), the tests are skipped and
  # the gates below accept that. That covers a squash or merge commit whose PR run tested the same merge result, and
  # release.sh's version commit, whose predecessor tested the same source. The candidate job still builds, probes and
  # scans an image for every main SHA, so its version, revision label and previous-release assets are that commit's.
  scope:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      source_changed: ${{ steps.diff.outputs.source_changed }}
      android_changed: ${{ steps.diff.outputs.android_changed }}
      stack_changed: ${{ steps.diff.outputs.stack_changed }}
      tree: ${{ steps.diff.outputs.tree }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Classify the change
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tree=$(scripts/ci-verdict.sh tree HEAD)
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          case "$EVENT" in
            push) files=$(git diff --name-only "$BEFORE" "$GITHUB_SHA") ;;
            pull_request) files=$(git diff --name-only "$BASE" "$GITHUB_SHA") ;;
            *)
              echo "source_changed=true" >> "$GITHUB_OUTPUT"
              echo "android_changed=true" >> "$GITHUB_OUTPUT"
              echo "stack_changed=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          # The cross-repo playback e2e is decided before, and apart from, reuse: its result depends on den-hearth's
          # latest release as well as on this tree, so a verdict recorded for the same tree against another release
          # proves nothing about this one. It runs on every main commit (each is a release candidate, VERSION-only
          # ones included) and on a pull request touching what a play crosses: the relay and its receipts, the web
          # player and cast page, or the suite.
          if [ "$EVENT" = push ] || grep -Eq '^(src/(relay|playback_receipts|handler|cast|grants|library|web)\.rs$|web/src/(lib/(playback|remux|scout|relayFetch|directSubtitles|grants|cast[A-Za-z]*)\.ts$|components/Player\.svelte$)|web/cast/|web/e2e-stack/|web/playwright\.stack\.config\.ts$|\.github/workflows/ci\.yml$)' <<<"$files"; then
            echo "stack_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "stack_changed=false" >> "$GITHUB_OUTPUT"
          fi
          # Main SHAs run side by side, so a version commit's predecessor may still be testing the same source: wait
          # for its verdict rather than test it a second time. Any other change looks once and otherwise runs in full.
          before_tree=""
          if [ "$EVENT" = push ]; then
            before_tree=$(scripts/ci-verdict.sh tree "$BEFORE" 2>/dev/null || true)
          fi
          run=""
          for _ in $(seq 1 90); do
            run=$(scripts/ci-verdict.sh find "$REPO" "$tree")
            [ -z "$run" ] && [ "$before_tree" = "$tree" ] || break
            pending=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?event=push&head_sha=$BEFORE" \
              --jq '[.workflow_runs[] | select(.status != "completed")] | length')
            [ "$pending" -gt 0 ] || break
            sleep 20
          done
          if [ -n "$run" ]; then
            url="https://github.com/$REPO/actions/runs/$run"
            echo "::notice title=Tests reused::source tree $tree already passed in $url"
            echo "Tests skipped: source tree \`$tree\` already passed in $url" >> "$GITHUB_STEP_SUMMARY"
            echo "source_changed=false" >> "$GITHUB_OUTPUT"
            echo "android_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "source_changed=true" >> "$GITHUB_OUTPUT"
          if grep -Eq '^(android-tv/|\.github/workflows/(ci|tv-android-publish)\.yml$)' <<<"$files"; then
            echo "android_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "android_changed=false" >> "$GITHUB_OUTPUT"
          fi

  rust_tests:
    name: Rust tests and checks
    needs: scope
    if: always() && needs.scope.outputs.source_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      # The assistant tests read den-spec's vectors from the submodule.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Environment examples
        run: scripts/check-env-examples.sh
      - name: Tests
        run: cargo test --locked -- --skip library::reset_lock::tests
      - name: Den-spec tool contracts
        working-directory: spec/tools
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -p 'test_*.py'
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Formatting
        run: cargo fmt --all --check

  # Reset-lock rehearsals deliberately perform many durable database restarts. They are valuable but I/O-bound, so
  # run them beside the rest of Rust instead of adding their full duration to the Rust critical path.
  reset_lock:
    name: Reset-lock durability tests
    needs: scope
    if: always() && needs.scope.outputs.source_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --locked library::reset_lock::tests

  # Preserve the existing required `test` status while the two Rust groups execute in parallel.
  test:
    needs: [scope, rust_tests, reset_lock]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require both Rust groups
        env:
          SOURCE_CHANGED: ${{ needs.scope.outputs.source_changed }}
          RUST_TESTS: ${{ needs.rust_tests.result }}
          RESET_LOCK: ${{ needs.reset_lock.result }}
        run: |
          if [ "$SOURCE_CHANGED" = false ]; then
            test "$RUST_TESTS" = skipped && test "$RESET_LOCK" = skipped
          else
            test "$RUST_TESTS" = success && test "$RESET_LOCK" = success
          fi

  # Checks which need Node but not a browser run once. Keeping them out of the Playwright shards avoids paying
  # for lint, unit tests, and production builds twice.
  web-checks:
    needs: scope
    if: always() && needs.scope.outputs.source_changed == 'true'
    runs-on: ubuntu-latest
    # GitHub's runner already ships Chrome. The built-worker behavior check uses it directly, without downloading
    # Playwright's browser or OS packages into this once-only job.
    env:
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run audit
      - run: npm run lint
      # The profile integration suites run against the real den-edge binary built from this commit. With
      # DEN_EDGE_REQUIRED=1 a missing binary fails them instead of skipping them.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: .
      # Two Vitest suites start Rust tests (`cargo test ...`) for the receipt bridge and the real recovery server.
      # Built here, their binaries are only run inside the suites; left to them, the first one compiled the whole
      # crate's test profile inside its 60 s test timeout, beside the other suite waiting on the same build lock.
      - name: Build den-edge and its Rust tests for the integration suites
        working-directory: .
        run: |
          cargo build --locked --bin den-edge
          cargo test --locked --no-run
      - run: npm test
        env:
          DEN_EDGE_REQUIRED: "1"
          DEN_EDGE_BIN: ${{ github.workspace }}/target/debug/den-edge
          # Reuse this job's Rust target cache for the deterministic HTTP-body fixture and real client recovery.
          DEN_EDGE_REAL_RECOVERY: "1"
      - run: node scripts/test-tv-core.mjs
      - run: npm run build
      - run: npm run check:tv-isolation
      - run: npm run test:e2e:keyboard
      - run: npm run test:e2e:tv
      # The full TV journey already ran against the platform-neutral/webOS build above and will run again in
      # WebKit below. Tizen's distinct branches are its AVPlay adapter and platform bootstrap; the packaged suite
      # separately covers the real Tizen bundle, file origin, CSP, API routing and playback. Re-sync additionally
      # exercises replacement of the exact same-language sidecar through the AVPlay adapter.
      - run: DEN_TV_PLATFORM=tizen npm run test:e2e:tv -- tv-avplay.spec.mjs tv-platform.spec.mjs tv-subtitle-resync.spec.mjs
      - run: npm run test:e2e:tv-package
      # Every ordinary source change must compile and verify the exact legacy package too; the release workflow is
      # too late to discover that a shared import or unsupported syntax no longer reaches Chromium 47.
      - run: node scripts/tizen-package.integration.mjs
      - run: npm run test:tv-preflight
      # Normal artifacts must not contain the test-only Player harness enabled by the E2E builds.
      - run: npm run build:tv:webos && npm run build:tv:tizen
      - name: Verify the runner browser used by the built-worker check
        run: test -x "$PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH"
      - run: npm run test:worker-build
      - run: npm run build:cast
      - name: Retain TV failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tv-failures
          path: web/test-results-tv
          if-no-files-found: ignore
          retention-days: 7

  android-tv:
    needs: scope
    if: always() && needs.scope.outputs.android_changed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-tv
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
          # setup-java's own Gradle cache: setup-gradle v6 moved its caching into a proprietary component.
          cache: gradle
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Test, build and lint the Android TV shell
        run: ./gradlew :app:lintDebug :app:testDebugUnitTest :app:assembleDebug --no-daemon

  # Playwright already uses all four CPUs on one hosted runner. File sharding supplies four runners without changing
  # test semantics; each shard owns independent browser contexts and the suite's isolated Vite server.
  e2e:
    needs: scope
    if: always() && needs.scope.outputs.source_changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: e2e (${{ matrix.shard }}/4)
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Verify Playwright image matches the lockfile
        run: |
          version=$(node -p "require('./node_modules/@playwright/test/package.json').version")
          test "$version" = 1.64.1 || {
            echo "::error::Playwright $version does not match mcr.microsoft.com/playwright:v1.64.1-noble"
            exit 1
          }
          node --input-type=module -e "import { chromium, firefox, webkit } from '@playwright/test'; import { existsSync } from 'node:fs'; for (const browser of [chromium, firefox, webkit]) if (!existsSync(browser.executablePath())) throw new Error('browser missing: ' + browser.executablePath())"
      - name: Browser sync policy
        if: matrix.shard == 1
        run: node test/sync-policy-browser.mjs
      - name: Browser behavior
        # Firefox refuses to run as root under a $HOME another user owns (the runner mounts /github/home for pwuser);
        # this is Playwright's documented workaround for its container.
        env:
          HOME: /root
        run: npx playwright test --grep-invert @soak --shard=${{ matrix.shard }}/4
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-failures-${{ matrix.shard }}-of-4
          path: web/test-results
          if-no-files-found: ignore
          retention-days: 7
  # The specs that start a profile household through the real app (`PRODUCTION_BUILD_SPECS` in playwright.config.ts)
  # wait on its library Workers' startup deadlines, so they run against the production build: from the shards' dev
  # server a loaded runner spent those deadlines evaluating unbundled modules.
  e2e_production:
    needs: scope
    if: always() && needs.scope.outputs.source_changed == 'true'
    runs-on: ubuntu-latest
    name: e2e (production build)
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Browser behavior on the production build
        run: npm run test:e2e:production
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-failures-production
          path: web/test-results
          if-no-files-found: ignore
          retention-days: 7
  # Chromium already exercises every platform-neutral TV journey in web-checks. WebKit gets the engine-sensitive
  # playback, input, navigation and presentation surfaces on its own runner, so it neither repeats all 71 cases nor
  # extends shard 1's critical path.
  e2e_tv_webkit:
    name: TV WebKit behavior
    needs: scope
    if: always() && needs.scope.outputs.source_changed == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - name: WebKit TV engine-sensitive behavior
        run: >-
          DEN_TV_TEST_ENGINE=webkit npm run test:e2e:tv --
          tv-playback.spec.mjs tv-navigation.spec.mjs tv-compatibility.spec.mjs
          tv-retained-input.spec.mjs tv-presentation.spec.mjs
      - name: Retain native TV failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tv-native-failures
          path: web/test-results-tv
          if-no-files-found: ignore
          retention-days: 7

  # Time budgets on a household the size of a long-lived one (`e2e/big-library-budgets.spec.mjs`), against the
  # production build a phone is served, one test at a time on a runner of their own: a budget is time, and beside the
  # shards' dev server and four workers it measured the runner rather than the app.
  e2e-budgets:
    needs: scope
    # Advisory performance measurements are intentionally outside the normal PR/push critical path.
    if: github.event_name == 'workflow_dispatch' && needs.scope.outputs.source_changed == 'true'
    runs-on: ubuntu-latest
    name: e2e budgets
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Time budgets on the production build
        id: budgets
        continue-on-error: true
        run: npm run test:e2e:budgets
      - name: Report exceeded timing budgets
        if: steps.budgets.outcome == 'failure'
        run: echo "::warning title=Timing budgets exceeded::Performance budgets are advisory; inspect the retained evidence."
      - name: Retain budget failure evidence
        if: steps.budgets.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: budget-failures
          path: web/test-results
          if-no-files-found: ignore
          retention-days: 7

  # Playback through the real den-edge (this commit) and the real den-hearth (its latest release), with fakes only at the
  # outside edges (`web/e2e-stack/`). Each repo's own suite fakes the other, which is how every member play through the
  # relay failed from 2026-10-29 with both green. It never takes a reused verdict (see `scope`), a failure here fails
  # this run, and `scripts/release.sh` tags only a main commit whose run succeeded.
  stack_e2e:
    name: Playback with den-hearth
    needs: scope
    if: always() && needs.scope.outputs.stack_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      hearth: ${{ steps.hearth.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # den-hearth's latest release, the one the box runs. Until a release has the e2e build, its main, or a pull
      # request's paired den-hearth branch of the same name.
      - name: Check out den-hearth's latest release
        id: hearth
        env:
          PAIRED: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none https://github.com/oxyc/den-hearth.git den-hearth
          has() { git -C den-hearth cat-file -e "$1:crates/hearth/src/stub.rs" 2>/dev/null; }
          ref=$(git -C den-hearth for-each-ref --count=1 --sort=-v:refname --format='%(refname:short)' 'refs/tags/v*')
          if [ -z "$ref" ] || ! has "$ref"; then
            echo "::warning::no den-hearth release has the stub-upstreams e2e build yet"
            ref=origin/main
            if ! has "$ref" && [ -n "$PAIRED" ] && has "origin/$PAIRED"; then ref="origin/$PAIRED"; fi
          fi
          has "$ref" || { echo "::error::no den-hearth ref has the stub-upstreams e2e build"; exit 1; }
          git -C den-hearth checkout --quiet "$ref"
          echo "tag=${ref#origin/}@$(git -C den-hearth rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            .
            den-hearth
          key: stack-e2e
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Playback through den-edge and den-hearth ${{ steps.hearth.outputs.tag }}
        run: web/e2e-stack/ci.sh . den-hearth
      - name: Retain failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: stack-e2e-failures
          path: web/test-results-stack
          if-no-files-found: ignore
          retention-days: 7

  # Preserve the stable `web` check name while making it represent the blocking once-only checks and every shard.
  # Timing budgets still run and retain evidence, but an over-budget measurement is advisory.
  web:
    if: always()
    needs: [scope, web-checks, e2e, e2e_production, e2e_tv_webkit, android-tv, stack_e2e]
    runs-on: ubuntu-latest
    steps:
      # Apart from source reuse: wherever it was due, it must have run and passed in this run.
      - name: Require the playback e2e with den-hearth wherever it was due
        env:
          STACK_CHANGED: ${{ needs.scope.outputs.stack_changed }}
          STACK: ${{ needs.stack_e2e.result }}
        run: |
          if [ "$STACK_CHANGED" = true ]; then test "$STACK" = success; else test "$STACK" = skipped; fi
      - name: Require every web check
        env:
          SOURCE_CHANGED: ${{ needs.scope.outputs.source_changed }}
          CHECKS: ${{ needs.web-checks.result }}
          E2E: ${{ needs.e2e.result }}
          E2E_PRODUCTION: ${{ needs.e2e_production.result }}
          TV_WEBKIT: ${{ needs.e2e_tv_webkit.result }}
          ANDROID_TV: ${{ needs.android-tv.result }}
          ANDROID_CHANGED: ${{ needs.scope.outputs.android_changed }}
        run: |
          if [ "$SOURCE_CHANGED" = false ]; then
            test "$CHECKS" = skipped && test "$E2E" = skipped && test "$E2E_PRODUCTION" = skipped && test "$TV_WEBKIT" = skipped && test "$ANDROID_TV" = skipped
          else
            test "$CHECKS" = success && test "$E2E" = success && test "$E2E_PRODUCTION" = success && test "$TV_WEBKIT" = success
            if [ "$ANDROID_CHANGED" = true ]; then
              test "$ANDROID_TV" = success
            else
              test "$ANDROID_TV" = skipped
            fi
          fi

  # Record that this exact source tree passed every blocking job, for a later run on byte-identical source. Only a
  # run that actually tested it records one; a PR's verdict also needs its image build to have succeeded.
  # The playback e2e is recorded beside the tree (`stack`: the den-hearth it ran against, or `not-run`) but is never
  # reused from it: `scope` decides it apart from the verdict, so a reused run never stands in for a playback pass.
  verdict:
    needs: [scope, test, web, build-pr, stack_e2e]
    if: >-
      always() && needs.scope.outputs.source_changed == 'true' && needs.test.result == 'success'
      && needs.web.result == 'success'
      && (needs.build-pr.result == 'success' || (github.event_name != 'pull_request' && needs.build-pr.result == 'skipped'))
    runs-on: ubuntu-latest
    steps:
      - name: Write the verdict
        env:
          TREE: ${{ needs.scope.outputs.tree }}
          EVENT: ${{ github.event_name }}
          STACK: ${{ needs.stack_e2e.result == 'success' && needs.stack_e2e.outputs.hearth || 'not-run' }}
        run: |
          jq -n --arg tree "$TREE" --arg sha "$GITHUB_SHA" --arg event "$EVENT" --arg run "$GITHUB_RUN_ID" \
            --arg stack "$STACK" '{tree: $tree, sha: $sha, event: $event, run: $run, stack: $stack}' > verdict.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-verdict-${{ needs.scope.outputs.tree }}
          path: verdict.json
          if-no-files-found: error
          retention-days: 14

  # A PR proves the same shared build graph that main will publish. It reads main's cache but deliberately does not
  # publish an image or overwrite the durable release cache with an unmerged revision.
  build-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read release metadata
        id: source
        run: |
          version=$(cat VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Build the runtime image
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: docker-bake.hcl
          set: |
            *.args.DEN_VERSION=${{ steps.source.outputs.version }}
            *.args.GIT_REVISION=${{ github.sha }}
            *.args.PREVIOUS_IMAGE=scratch
            *.output=type=cacheonly

  # Main builds and scans immutable candidates while the test jobs run. They are intentionally unsigned and never
  # receive :latest here; docker-publish promotes them only after this exact workflow has succeeded.
  candidate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read release metadata
        id: source
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::VERSION is not X.Y.Z: $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Resolve the previous release
        id: previous
        run: |
          if docker buildx imagetools inspect "$IMAGE:latest" >/dev/null 2>&1; then
            echo "image=$IMAGE:latest" >> "$GITHUB_OUTPUT"
          else
            echo "image=scratch" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push the candidate
        id: bake
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: docker-bake.hcl
          push: true
          set: |
            *.args.DEN_VERSION=${{ steps.source.outputs.version }}
            *.args.GIT_REVISION=${{ github.sha }}
            *.args.PREVIOUS_IMAGE=${{ steps.previous.outputs.image }}
            edge.tags=${{ env.IMAGE }}:candidate-${{ github.sha }}
            edge.cache-to=type=gha,mode=max,scope=release-images
      - name: Record candidate digest
        id: images
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
        run: |
          set -euo pipefail
          edge=$(jq -r '.edge["containerimage.digest"] // empty' <<<"$METADATA")
          test -n "$edge"
          echo "edge=$edge" >> "$GITHUB_OUTPUT"
      - name: Prove the image reports its release version and serves the isolated Cast and TV pages
        env:
          DIGEST: ${{ steps.images.outputs.edge }}
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE@$DIGEST" >/dev/null
          id=$(docker run --rm -d -e CAST_ORIGIN=https://cast.invalid -e TV_WEB_HOSTS=den-tv.invalid \
            -p 127.0.0.1:18080:8080 "$IMAGE@$DIGEST")
          trap 'docker rm -f "$id" >/dev/null 2>&1 || true' EXIT
          body=""
          for _ in $(seq 1 20); do
            body=$(curl -fsS http://127.0.0.1:18080/version 2>/dev/null) && break
            sleep 1
          done
          got=$(jq -r .version <<<"$body")
          test "$got" = "$VERSION" || { echo "::error::image /version is $got, expected $VERSION"; exit 1; }
          cast=$(curl -fsS -H 'Host: cast.invalid' http://127.0.0.1:18080/)
          grep -q '<title>Den Cast</title>' <<<"$cast" || { echo "::error::the Cast host did not serve the Cast page"; exit 1; }
          tv=$(curl -fsS -H 'Host: den-tv.invalid' http://127.0.0.1:18080/)
          grep -q '<title>Den TV</title>' <<<"$tv" || { echo "::error::the TV host did not serve the TV page"; exit 1; }
      - name: Scan edge image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.images.outputs.edge }}
          version: v0.74.0
          format: json
          output: trivy.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
      - name: Gate on fixable critical findings
        run: trivy convert --severity CRITICAL --exit-code 1 --format table trivy.json
      - name: Bind this CI run to its candidate digest
        env:
          EDGE_DIGEST: ${{ steps.images.outputs.edge }}
        run: |
          jq -n --arg edge "$EDGE_DIGEST" '{edge: $edge}' > candidate-digests.json
      - name: Save candidate identity for release promotion
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-candidate-${{ github.sha }}
          path: candidate-digests.json
          if-no-files-found: error
          retention-days: 30
      - name: Report edge scan
        continue-on-error: true
        run: trivy convert --format sarif --output trivy.sarif trivy.json
      - name: Upload edge scan
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        continue-on-error: true
        with:
          sarif_file: trivy.sarif
          category: trivy-image
