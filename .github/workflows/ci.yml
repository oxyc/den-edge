name: ci

# Every exact main commit produces a scanned, immutable candidate image while its checks run. A release tag only
# promotes those already-tested digests; it never recompiles or reruns this workflow.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR revisions are disposable. A main SHA is a potential release and its candidate must finish even
  # when another merge follows it, otherwise a tag could name a commit whose exact image was cancelled midway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/${{ github.repository_owner }}/den-edge

jobs:
  # A release commit changes only VERSION. Its source tree was already checked on the immediately preceding main
  # commit; the candidate job below still rebuilds that exact version, probes /version and the Cast page, and scans
  # the resulting image. Do not spend another five browser runners and a Rust runner on byte-identical sources.
  scope:
    runs-on: ubuntu-latest
    outputs:
      source_changed: ${{ steps.diff.outputs.source_changed }}
      android_changed: ${{ steps.diff.outputs.android_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Classify the main change
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            push) files=$(git diff --name-only "$BEFORE" "$GITHUB_SHA") ;;
            pull_request) files=$(git diff --name-only "$BASE" "$GITHUB_SHA") ;;
            *)
              echo "source_changed=true" >> "$GITHUB_OUTPUT"
              echo "android_changed=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          if [ "$files" = VERSION ]; then
            echo "source_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "source_changed=true" >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq '^(android-tv/|\.github/workflows/(ci|tv-android-publish)\.yml$)' <<<"$files"; then
            echo "android_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "android_changed=false" >> "$GITHUB_OUTPUT"
          fi

  rust_tests:
    name: Rust tests and checks
    needs: scope
    if: always() && needs.scope.outputs.source_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      # The assistant tests read den-spec's vectors from the submodule.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Tests
        run: cargo test --locked -- --skip library::reset_lock::tests
      - name: Den-spec tool contracts
        working-directory: spec/tools
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -p 'test_*.py'
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Formatting
        run: cargo fmt --all --check

  # Reset-lock rehearsals deliberately perform many durable database restarts. They are valuable but I/O-bound, so
  # run them beside the rest of Rust instead of adding their full duration to the Rust critical path.
  reset_lock:
    name: Reset-lock durability tests
    needs: scope
    if: always() && needs.scope.outputs.source_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --locked library::reset_lock::tests

  # Preserve the existing required `test` status while the two Rust groups execute in parallel.
  test:
    needs: [scope, rust_tests, reset_lock]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require both Rust groups
        env:
          SOURCE_CHANGED: ${{ needs.scope.outputs.source_changed }}
          RUST_TESTS: ${{ needs.rust_tests.result }}
          RESET_LOCK: ${{ needs.reset_lock.result }}
        run: |
          if [ "$SOURCE_CHANGED" = false ]; then
            test "$RUST_TESTS" = skipped && test "$RESET_LOCK" = skipped
          else
            test "$RUST_TESTS" = success && test "$RESET_LOCK" = success
          fi

  # Checks which need Node but not a browser run once. Keeping them out of the Playwright shards avoids paying
  # for lint, unit tests, and production builds twice.
  web-checks:
    needs: scope
    if: always() && needs.scope.outputs.source_changed == 'true'
    runs-on: ubuntu-latest
    # GitHub's runner already ships Chrome. The built-worker behavior check uses it directly, without downloading
    # Playwright's browser or OS packages into this once-only job.
    env:
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run audit
      - run: npm run lint
      # The profile integration suites run against the real den-edge binary built from this commit. With
      # DEN_EDGE_REQUIRED=1 a missing binary fails them instead of skipping them.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: .
      - name: Build den-edge for the integration suites
        working-directory: .
        run: cargo build --locked --bin den-edge
      - run: npm test
        env:
          DEN_EDGE_REQUIRED: "1"
          DEN_EDGE_BIN: ${{ github.workspace }}/target/debug/den-edge
          # Reuse this job's Rust target cache for the deterministic HTTP-body fixture and real client recovery.
          DEN_EDGE_REAL_RECOVERY: "1"
      - run: node scripts/test-tv-core.mjs
      - run: npm run build
      - run: npm run check:tv-isolation
      - run: npm run test:e2e:keyboard
      - run: npm run test:e2e:tv
      # The full TV journey already ran against the platform-neutral/webOS build above and will run again in
      # WebKit below. Tizen's distinct branches are its AVPlay adapter and platform bootstrap; the packaged suite
      # separately covers the real Tizen bundle, file origin, CSP, API routing and playback. Re-sync additionally
      # exercises replacement of the exact same-language sidecar through the AVPlay adapter.
      - run: DEN_TV_PLATFORM=tizen npm run test:e2e:tv -- tv-avplay.spec.mjs tv-platform.spec.mjs tv-subtitle-resync.spec.mjs
      - run: npm run test:e2e:tv-package
      - run: DEN_SKIP_TIZEN3=1 node scripts/tizen-package.integration.mjs
      - run: npm run test:tv-preflight
      # Normal artifacts must not contain the test-only Player harness enabled by the E2E builds.
      - run: npm run build:tv:webos && npm run build:tv:tizen
      - name: Verify the runner browser used by the built-worker check
        run: test -x "$PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH"
      - run: npm run test:worker-build
      - run: npm run build:cast
      - name: Retain TV failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tv-failures
          path: web/test-results-tv
          if-no-files-found: ignore
          retention-days: 7

  android-tv:
    needs: scope
    if: always() && needs.scope.outputs.android_changed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-tv
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
          # setup-java's own Gradle cache: setup-gradle v6 moved its caching into a proprietary component.
          cache: gradle
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Test, build and lint the Android TV shell
        run: ./gradlew :app:lintDebug :app:testDebugUnitTest :app:assembleDebug --no-daemon

  # Playwright already uses all four CPUs on one hosted runner. File sharding supplies four runners without changing
  # test semantics; each shard owns independent browser contexts and the suite's isolated Vite server.
  e2e:
    needs: scope
    if: always() && needs.scope.outputs.source_changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: e2e (${{ matrix.shard }}/4)
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Verify Playwright image matches the lockfile
        run: |
          version=$(node -p "require('./node_modules/@playwright/test/package.json').version")
          test "$version" = 1.64.1 || {
            echo "::error::Playwright $version does not match mcr.microsoft.com/playwright:v1.64.1-noble"
            exit 1
          }
          node --input-type=module -e "import { chromium, webkit } from '@playwright/test'; import { existsSync } from 'node:fs'; for (const browser of [chromium, webkit]) if (!existsSync(browser.executablePath())) throw new Error('browser missing: ' + browser.executablePath())"
      - name: Browser sync policy
        if: matrix.shard == 1
        run: node test/sync-policy-browser.mjs
      - name: Browser behavior
        run: npx playwright test --grep-invert @soak --shard=${{ matrix.shard }}/4
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-failures-${{ matrix.shard }}-of-4
          path: web/test-results
          if-no-files-found: ignore
          retention-days: 7
  # Chromium already exercises every platform-neutral TV journey in web-checks. WebKit gets the engine-sensitive
  # playback, input, navigation and presentation surfaces on its own runner, so it neither repeats all 71 cases nor
  # extends shard 1's critical path.
  e2e_tv_webkit:
    name: TV WebKit behavior
    needs: scope
    if: always() && needs.scope.outputs.source_changed == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - name: WebKit TV engine-sensitive behavior
        run: >-
          DEN_TV_TEST_ENGINE=webkit npm run test:e2e:tv --
          tv-playback.spec.mjs tv-navigation.spec.mjs tv-compatibility.spec.mjs
          tv-retained-input.spec.mjs tv-presentation.spec.mjs
      - name: Retain native TV failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tv-native-failures
          path: web/test-results-tv
          if-no-files-found: ignore
          retention-days: 7

  # Time budgets on a household the size of a long-lived one (`e2e/big-library-budgets.spec.mjs`), against the
  # production build a phone is served, one test at a time on a runner of their own: a budget is time, and beside the
  # shards' dev server and four workers it measured the runner rather than the app.
  e2e-budgets:
    needs: scope
    # Advisory performance measurements are intentionally outside the normal PR/push critical path.
    if: github.event_name == 'workflow_dispatch' && needs.scope.outputs.source_changed == 'true'
    runs-on: ubuntu-latest
    name: e2e budgets
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Time budgets on the production build
        id: budgets
        continue-on-error: true
        run: npm run test:e2e:budgets
      - name: Report exceeded timing budgets
        if: steps.budgets.outcome == 'failure'
        run: echo "::warning title=Timing budgets exceeded::Performance budgets are advisory; inspect the retained evidence."
      - name: Retain budget failure evidence
        if: steps.budgets.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: budget-failures
          path: web/test-results
          if-no-files-found: ignore
          retention-days: 7

  # Preserve the stable `web` check name while making it represent the blocking once-only checks and every shard.
  # Timing budgets still run and retain evidence, but an over-budget measurement is advisory.
  web:
    if: always()
    needs: [scope, web-checks, e2e, e2e_tv_webkit, android-tv]
    runs-on: ubuntu-latest
    steps:
      - name: Require every web check
        env:
          SOURCE_CHANGED: ${{ needs.scope.outputs.source_changed }}
          CHECKS: ${{ needs.web-checks.result }}
          E2E: ${{ needs.e2e.result }}
          TV_WEBKIT: ${{ needs.e2e_tv_webkit.result }}
          ANDROID_TV: ${{ needs.android-tv.result }}
          ANDROID_CHANGED: ${{ needs.scope.outputs.android_changed }}
        run: |
          if [ "$SOURCE_CHANGED" = false ]; then
            test "$CHECKS" = skipped && test "$E2E" = skipped && test "$TV_WEBKIT" = skipped && test "$ANDROID_TV" = skipped
          else
            test "$CHECKS" = success && test "$E2E" = success && test "$TV_WEBKIT" = success
            if [ "$ANDROID_CHANGED" = true ]; then
              test "$ANDROID_TV" = success
            else
              test "$ANDROID_TV" = skipped
            fi
          fi

  # A PR proves the same shared build graph that main will publish. It reads main's cache but deliberately does not
  # publish an image or overwrite the durable release cache with an unmerged revision.
  build-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read release metadata
        id: source
        run: |
          version=$(cat VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Build the runtime image
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: docker-bake.hcl
          set: |
            *.args.DEN_VERSION=${{ steps.source.outputs.version }}
            *.args.GIT_REVISION=${{ github.sha }}
            *.args.PREVIOUS_IMAGE=scratch
            *.output=type=cacheonly

  # Main builds and scans immutable candidates while the test jobs run. They are intentionally unsigned and never
  # receive :latest here; docker-publish promotes them only after this exact workflow has succeeded.
  candidate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read release metadata
        id: source
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::VERSION is not X.Y.Z: $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Resolve the previous release
        id: previous
        run: |
          if docker buildx imagetools inspect "$IMAGE:latest" >/dev/null 2>&1; then
            echo "image=$IMAGE:latest" >> "$GITHUB_OUTPUT"
          else
            echo "image=scratch" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push the candidate
        id: bake
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: docker-bake.hcl
          push: true
          set: |
            *.args.DEN_VERSION=${{ steps.source.outputs.version }}
            *.args.GIT_REVISION=${{ github.sha }}
            *.args.PREVIOUS_IMAGE=${{ steps.previous.outputs.image }}
            edge.tags=${{ env.IMAGE }}:candidate-${{ github.sha }}
            edge.cache-to=type=gha,mode=max,scope=release-images
      - name: Record candidate digest
        id: images
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
        run: |
          set -euo pipefail
          edge=$(jq -r '.edge["containerimage.digest"] // empty' <<<"$METADATA")
          test -n "$edge"
          echo "edge=$edge" >> "$GITHUB_OUTPUT"
      - name: Prove the image reports its release version and serves the isolated Cast and TV pages
        env:
          DIGEST: ${{ steps.images.outputs.edge }}
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE@$DIGEST" >/dev/null
          id=$(docker run --rm -d -e CAST_ORIGIN=https://cast.invalid -e TV_WEB_HOSTS=den-tv.invalid \
            -p 127.0.0.1:18080:8080 "$IMAGE@$DIGEST")
          trap 'docker rm -f "$id" >/dev/null 2>&1 || true' EXIT
          body=""
          for _ in $(seq 1 20); do
            body=$(curl -fsS http://127.0.0.1:18080/version 2>/dev/null) && break
            sleep 1
          done
          got=$(jq -r .version <<<"$body")
          test "$got" = "$VERSION" || { echo "::error::image /version is $got, expected $VERSION"; exit 1; }
          cast=$(curl -fsS -H 'Host: cast.invalid' http://127.0.0.1:18080/)
          grep -q '<title>Den Cast</title>' <<<"$cast" || { echo "::error::the Cast host did not serve the Cast page"; exit 1; }
          tv=$(curl -fsS -H 'Host: den-tv.invalid' http://127.0.0.1:18080/)
          grep -q '<title>Den TV</title>' <<<"$tv" || { echo "::error::the TV host did not serve the TV page"; exit 1; }
      - name: Scan edge image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.images.outputs.edge }}
          version: v0.74.0
          format: json
          output: trivy.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
      - name: Gate on fixable critical findings
        run: trivy convert --severity CRITICAL --exit-code 1 --format table trivy.json
      - name: Bind this CI run to its candidate digest
        env:
          EDGE_DIGEST: ${{ steps.images.outputs.edge }}
        run: |
          jq -n --arg edge "$EDGE_DIGEST" '{edge: $edge}' > candidate-digests.json
      - name: Save candidate identity for release promotion
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-candidate-${{ github.sha }}
          path: candidate-digests.json
          if-no-files-found: error
          retention-days: 30
      - name: Report edge scan
        continue-on-error: true
        run: trivy convert --format sarif --output trivy.sarif trivy.json
      - name: Upload edge scan
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        continue-on-error: true
        with:
          sarif_file: trivy.sarif
          category: trivy-image
