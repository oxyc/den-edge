name: ci

# Tests, lints and the formatting check on every push and PR; docker-publish.yml calls this as its gate, so a
# tag cannot publish an image CI would reject.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Tests
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Formatting
        run: cargo fmt --all --check

  # The Den web app den-edge serves: type-checked, tested and built, as the image's web stage builds it.
  web:
    runs-on: ubuntu-latest
    # Keep this tag and the assertion below equal to web/package-lock.json's @playwright/test version.
    # The official image supplies that release's exact browsers and Linux dependencies, avoiding a
    # network/apt install on every run. Chromium recommends host IPC in containers to avoid OOM crashes.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      # The app and fixtures are repository-controlled; the image's default root user also keeps checkout/setup-node
      # compatible with GitHub's mounted workspace. Playwright documents root as suitable for trusted E2E tests.
      options: --ipc=host
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true # spec/: den-spec's vectors, which the wire tests load
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Verify Playwright image matches the lockfile
        run: |
          version=$(node -p "require('./node_modules/@playwright/test/package.json').version")
          test "$version" = 1.63.0 || {
            echo "::error::Playwright $version does not match mcr.microsoft.com/playwright:v1.63.0-noble"
            exit 1
          }
          node --input-type=module -e "import { chromium, webkit } from '@playwright/test'; import { existsSync } from 'node:fs'; for (const browser of [chromium, webkit]) if (!existsSync(browser.executablePath())) throw new Error('browser missing: ' + browser.executablePath())"
      # A known high or critical advisory in any web dependency fails the build, as it would ship in
      # the image — except one on scripts/audit.mjs's time-boxed allowlist (dev-tooling-only advisories
      # with no fix upstream, re-reviewed on expiry).
      - run: npm run audit
      - run: npm run lint
      - run: npm test
      - run: node test/sync-policy-browser.mjs
      # Real-time player switching soaks run weekly/on demand in player-switch-soak.yml.
      - run: npm run test:e2e
      - run: npm run build
      - run: npm run test:worker-build
      - run: npm run build:cast

  # The image is what ships, and it builds differently from `cargo build` (musl, scratch). Caught on the PR
  # rather than at tag time, for amd64 — the only arch the box runs. The two images build side by side; each
  # keeps the cache scope docker-publish.yml uses for it, so a release still starts from the PR's layers.
  build-pr:
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: den-edge
            file: Dockerfile
            scope: ""
          - image: den-cast
            file: Dockerfile.cast
            scope: ",scope=cast"
    name: build-pr (${{ matrix.image }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          platforms: linux/amd64
          cache-from: type=gha${{ matrix.scope }}
          cache-to: type=gha,mode=max${{ matrix.scope }}
