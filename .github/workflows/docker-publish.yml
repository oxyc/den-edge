# Main CI builds and scans immutable candidate images. A vX.Y.Z tag promotes the exact digests recorded by that
# successful main run; it does not compile or test the same commit again. Monday/manual runs retain the old security
# patch behavior: rebuild the newest release without cache, scan it, sign it, and move :latest.
name: docker-publish

on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "37 3 * * 1"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/den-edge
  CAST_IMAGE: ghcr.io/${{ github.repository_owner }}/den-cast

concurrency:
  group: docker-publish
  cancel-in-progress: false

permissions: {}

jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.pick.outputs.ref }}
      version: ${{ steps.pick.outputs.version }}
      patch: ${{ steps.pick.outputs.patch }}
      stamp: ${{ steps.pick.outputs.stamp }}
    steps:
      - name: Select released source
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = push ]; then
            ref="$GITHUB_REF_NAME"; patch=false
          else
            test "$GITHUB_REF" = refs/heads/main || { echo "::error::run a patch rebuild from main, not $GITHUB_REF"; exit 1; }
            ref=$(git ls-remote --tags --refs "https://github.com/$REPO.git" 'v*' \
              | sed 's|.*refs/tags/||' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)
            test -n "$ref" || { echo "::error::no vX.Y.Z tag to rebuild"; exit 1; }
            patch=true
          fi
          [[ "$ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::release tag is not vX.Y.Z: $ref"; exit 1; }
          {
            echo "ref=$ref"
            echo "version=${ref#v}"
            echo "patch=$patch"
            echo "stamp=$(date -u +%Y%m%d).$GITHUB_RUN_NUMBER"
          } >> "$GITHUB_OUTPUT"

  # A release consumes the digest record emitted only after the exact main workflow built, behavior-probed, and
  # scanned both images. Resolving by the artifact rather than a moving tag binds promotion to that CI run.
  candidate:
    if: github.event_name == 'push'
    needs: source
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: read
    outputs:
      edge: ${{ steps.images.outputs.edge }}
      cast: ${{ steps.images.outputs.cast }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.source.outputs.ref }}
          persist-credentials: false
      - name: Verify tag metadata
        id: commit
        env:
          EXPECTED: ${{ needs.source.outputs.version }}
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          test "$version" = "$EXPECTED" || { echo "::error::tag says $EXPECTED but VERSION says $version"; exit 1; }
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Find the successful exact-main run
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 80); do
            row=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?event=push&head_sha=$SHA&per_page=100" \
              --jq '[.workflow_runs[] | select(.head_branch == "main")] | sort_by(.run_number) | last | if . == null then "" else [.id, .status, (.conclusion // "-")] | @tsv end')
            if [ -n "$row" ]; then
              IFS=$'\t' read -r id status conclusion <<<"$row"
              if [ "$status" = completed ]; then
                test "$conclusion" = success || { echo "::error::exact main CI $id finished $conclusion"; exit 1; }
                echo "run_id=$id" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            sleep 15
          done
          echo "::error::no successful main CI completed for $SHA within 20 minutes"
          exit 1
      - name: Download the scanned digest record
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-candidate-${{ steps.commit.outputs.sha }}
          run-id: ${{ steps.ci.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Verify candidate identity
        id: images
        env:
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          edge=$(jq -r .edge candidate-digests.json)
          cast=$(jq -r .cast candidate-digests.json)
          [[ "$edge" =~ ^sha256:[0-9a-f]{64}$ ]] && [[ "$cast" =~ ^sha256:[0-9a-f]{64}$ ]]
          live_edge=$(docker buildx imagetools inspect "$IMAGE:candidate-$SHA" --format '{{json .Manifest}}' | jq -r .digest)
          live_cast=$(docker buildx imagetools inspect "$CAST_IMAGE:candidate-$SHA" --format '{{json .Manifest}}' | jq -r .digest)
          test "$live_edge" = "$edge" && test "$live_cast" = "$cast" || {
            echo "::error::candidate tag no longer matches the digests recorded by main CI"; exit 1; }
          echo "edge=$edge" >> "$GITHUB_OUTPUT"
          echo "cast=$cast" >> "$GITHUB_OUTPUT"
      - name: Prove /version matches the release tag
        env:
          DIGEST: ${{ steps.images.outputs.edge }}
          VERSION: ${{ needs.source.outputs.version }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE@$DIGEST" >/dev/null
          id=$(docker run --rm -d -p 127.0.0.1:18080:8080 "$IMAGE@$DIGEST")
          trap 'docker rm -f "$id" >/dev/null 2>&1 || true' EXIT
          body=""
          for _ in $(seq 1 20); do
            body=$(curl -fsS http://127.0.0.1:18080/version 2>/dev/null) && break
            sleep 1
          done
          got=$(jq -r .version <<<"$body")
          test "$got" = "$VERSION" || { echo "::error::image /version is $got, tag is $VERSION"; exit 1; }

  # Security patch rebuilds intentionally bypass the candidate: their purpose is to pull fresh base packages even
  # when source did not change. They retain the full build, behavior probe, scan, and gate.
  patch-build:
    if: github.event_name != 'push'
    needs: source
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      edge: ${{ steps.images.outputs.edge }}
      cast: ${{ steps.images.outputs.cast }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.source.outputs.ref }}
          persist-credentials: false
      - name: Verify release metadata
        id: commit
        env:
          EXPECTED: ${{ needs.source.outputs.version }}
        run: |
          if [ ! -f VERSION ] || [ ! -f docker-bake.hcl ]; then
            echo "::error::newest tag predates the candidate pipeline; cut one release from current main before running a patch rebuild"
            exit 1
          fi
          test "$(cat VERSION)" = "$EXPECTED"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Resolve the previous release
        id: previous
        run: |
          if docker buildx imagetools inspect "$IMAGE:latest" >/dev/null 2>&1; then
            echo "image=$IMAGE:latest" >> "$GITHUB_OUTPUT"
          else
            echo "image=scratch" >> "$GITHUB_OUTPUT"
          fi
      - name: Rebuild both images without cache
        id: bake
        uses: docker/bake-action@5be5f02ff8819ecd3092ea6b2e6261c31774f2b4 # v6
        with:
          source: .
          files: docker-bake.hcl
          push: true
          set: |
            *.args.DEN_VERSION=${{ needs.source.outputs.version }}
            *.args.GIT_REVISION=${{ steps.commit.outputs.sha }}
            *.args.PREVIOUS_IMAGE=${{ steps.previous.outputs.image }}
            *.no-cache=true
            edge.tags=${{ env.IMAGE }}:${{ needs.source.outputs.version }}-patch.${{ needs.source.outputs.stamp }}
            cast.tags=${{ env.CAST_IMAGE }}:${{ needs.source.outputs.version }}-patch.${{ needs.source.outputs.stamp }}
            edge.cache-to=type=gha,mode=max,scope=release-images
      - name: Record rebuilt digests
        id: images
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
        run: |
          edge=$(jq -r '.edge["containerimage.digest"] // empty' <<<"$METADATA")
          cast=$(jq -r '.cast["containerimage.digest"] // empty' <<<"$METADATA")
          test -n "$edge" && test -n "$cast"
          echo "edge=$edge" >> "$GITHUB_OUTPUT"
          echo "cast=$cast" >> "$GITHUB_OUTPUT"
      - name: Prove the rebuilt image
        env:
          DIGEST: ${{ steps.images.outputs.edge }}
          VERSION: ${{ needs.source.outputs.version }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE@$DIGEST" >/dev/null
          id=$(docker run --rm -d -p 127.0.0.1:18080:8080 "$IMAGE@$DIGEST")
          trap 'docker rm -f "$id" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 20); do
            body=$(curl -fsS http://127.0.0.1:18080/version 2>/dev/null) && break
            sleep 1
          done
          test "$(jq -r .version <<<"${body:-}")" = "$VERSION"
          curl -fsS http://127.0.0.1:18080/config | jq -e '.minSupportedVersion' >/dev/null
      - name: Scan edge image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.images.outputs.edge }}
          version: v0.74.0
          format: json
          output: trivy.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
      - name: Scan Cast image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.CAST_IMAGE }}@${{ steps.images.outputs.cast }}
          version: v0.74.0
          format: json
          output: trivy-cast.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
      - name: Gate on fixable critical OS findings
        run: |
          jq '.Results = ((.Results // []) | map(select(.Class == "os-pkgs")))' trivy.json > gate.json
          jq '.Results = ((.Results // []) | map(select(.Class == "os-pkgs")))' trivy-cast.json > gate-cast.json
          trivy convert --severity CRITICAL --exit-code 1 --format table gate.json
          trivy convert --severity CRITICAL --exit-code 1 --format table gate-cast.json
      - name: Report edge scan
        continue-on-error: true
        run: trivy convert --format sarif --output trivy.sarif trivy.json
      - name: Upload edge scan
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        continue-on-error: true
        with:
          sarif_file: trivy.sarif
          category: trivy-image
      - name: Report Cast scan
        continue-on-error: true
        run: trivy convert --format sarif --output trivy-cast.sarif trivy-cast.json
      - name: Upload Cast scan
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        continue-on-error: true
        with:
          sarif_file: trivy-cast.sarif
          category: trivy-cast-image

  # Only this workflow signs and advances :latest, preserving den-update's existing signature identity, throwaway
  # probe, digest pin, live probe, and rollback path.
  release:
    needs: [source, candidate, patch-build]
    if: ${{ !cancelled() && needs.source.result == 'success' && ((needs.source.outputs.patch == 'false' && needs.candidate.result == 'success') || (needs.source.outputs.patch == 'true' && needs.patch-build.result == 'success')) }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign exact digests
        env:
          EDGE_DIGEST: ${{ needs.candidate.outputs.edge || needs.patch-build.outputs.edge }}
          CAST_DIGEST: ${{ needs.candidate.outputs.cast || needs.patch-build.outputs.cast }}
        run: |
          cosign sign --yes "$IMAGE@$EDGE_DIGEST"
          cosign sign --yes "$CAST_IMAGE@$CAST_DIGEST"
      - name: Publish release tags and move latest last
        env:
          EDGE_DIGEST: ${{ needs.candidate.outputs.edge || needs.patch-build.outputs.edge }}
          CAST_DIGEST: ${{ needs.candidate.outputs.cast || needs.patch-build.outputs.cast }}
          SHA: ${{ needs.candidate.outputs.sha || needs.patch-build.outputs.sha }}
          VERSION: ${{ needs.source.outputs.version }}
          PATCH: ${{ needs.source.outputs.patch }}
          STAMP: ${{ needs.source.outputs.stamp }}
        run: |
          set -euo pipefail
          if [ "$PATCH" = true ]; then
            edge_tags=(--tag "$IMAGE:$VERSION-patch.$STAMP")
            cast_tags=(--tag "$CAST_IMAGE:$VERSION-patch.$STAMP")
          else
            minor=${VERSION%.*}; major=${VERSION%%.*}; short=${SHA:0:7}
            edge_tags=(--tag "$IMAGE:$VERSION" --tag "$IMAGE:$minor" --tag "$IMAGE:$major" --tag "$IMAGE:sha-$short")
            cast_tags=(--tag "$CAST_IMAGE:$VERSION" --tag "$CAST_IMAGE:$minor" --tag "$CAST_IMAGE:$major" --tag "$CAST_IMAGE:sha-$short")
          fi
          docker buildx imagetools create "${edge_tags[@]}" "$IMAGE@$EDGE_DIGEST"
          docker buildx imagetools create "${cast_tags[@]}" "$CAST_IMAGE@$CAST_DIGEST"
          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$EDGE_DIGEST"
          docker buildx imagetools create --tag "$CAST_IMAGE:latest" "$CAST_IMAGE@$CAST_DIGEST"
          moved=$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{json .Manifest}}' | jq -r .digest)
          test "$moved" = "$EDGE_DIGEST" || { echo "::error::latest resolved to $moved, not $EDGE_DIGEST"; exit 1; }
          moved=$(docker buildx imagetools inspect "$CAST_IMAGE:latest" --format '{{json .Manifest}}' | jq -r .digest)
          test "$moved" = "$CAST_DIGEST" || { echo "::error::Cast latest resolved to $moved, not $CAST_DIGEST"; exit 1; }
