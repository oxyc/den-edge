# Build the den-edge image and push it to GitHub Container Registry, on a v* tag — den-atlas's workflow.
#
# Every Monday, and on a manual run, the NEWEST v* tag is rebuilt instead: released code only, never main,
# with the base images re-pulled and no build cache, so a toolchain or musl security fix reaches the box
# between releases — through den-update's probe and rollback, like any release.
name: docker-publish

on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "37 3 * * 1"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/den-edge
  CAST_IMAGE: ghcr.io/${{ github.repository_owner }}/den-cast

# One publish at a time, never cancelled: a patch rebuild and a release must not race each other to :latest.
concurrency:
  group: docker-publish
  cancel-in-progress: false

permissions: {}

jobs:
  # What to build. A tag push builds that tag. A scheduled or manual run rebuilds the newest vX.Y.Z tag.
  source:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.pick.outputs.ref }}
      version: ${{ steps.pick.outputs.version }}
      patch: ${{ steps.pick.outputs.patch }}
      stamp: ${{ steps.pick.outputs.stamp }}
    steps:
      - name: Pick the release to build
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = push ]; then
            ref="$GITHUB_REF_NAME"; patch=false
          else
            test "$GITHUB_REF" = refs/heads/main || { echo "::error::run a patch rebuild from main, not $GITHUB_REF"; exit 1; }
            ref=$(git ls-remote --tags --refs "https://github.com/$REPO.git" 'v*' \
              | sed 's|.*refs/tags/||' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)
            test -n "$ref" || { echo "::error::no vX.Y.Z tag to rebuild"; exit 1; }
            patch=true
          fi
          echo "building $ref (patch rebuild: $patch)"
          {
            echo "ref=$ref"
            echo "version=${ref#v}"
            echo "patch=$patch"
            echo "stamp=$(date -u +%Y%m%d).$GITHUB_RUN_NUMBER"
          } >> "$GITHUB_OUTPUT"

  # The whole of ci.yml, against the tagged commit. Not on a patch rebuild: that source passed it when tagged.
  # It runs beside the build rather than before it; `release` waits for both, and nothing is signed or moves
  # :latest until it passed.
  ci:
    if: github.event_name == 'push'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  # Builds, pushes by digest and version tags, and scans. What it pushes is unsigned and not :latest, which is
  # all the box deploys, so building before CI has passed publishes nothing the box would take.
  build:
    needs: [source]
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      cast_digest: ${{ steps.build-cast.outputs.digest }}
    permissions:
      contents: read
      packages: write
      security-events: write  # Trivy's report goes to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.source.outputs.ref }}
          persist-credentials: false

      # /version reads env!("CARGO_PKG_VERSION") and the image tag is the git tag, so they must agree.
      - name: Tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cargo_v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "Cargo.toml=$cargo_v  tag=$GITHUB_REF_NAME"
          test "v$cargo_v" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME != Cargo.toml v$cargo_v — bump Cargo.toml before tagging"; exit 1; }

      - name: Commit being built
        id: rev
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # :latest is deliberately absent: it is the tag the box deploys, so it moves last, below, and only to
          # an image that passed the scan and was signed.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,enable=${{ github.event_name == 'push' }}
            type=raw,value=${{ needs.source.outputs.version }}-patch.${{ needs.source.outputs.stamp }},enable=${{ github.event_name != 'push' }}
          labels: |
            org.opencontainers.image.version=${{ needs.source.outputs.version }}
            org.opencontainers.image.revision=${{ steps.rev.outputs.sha }}

      - name: Derive Cast tags
        id: meta-cast
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.CAST_IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,enable=${{ github.event_name == 'push' }}
            type=raw,value=${{ needs.source.outputs.version }}-patch.${{ needs.source.outputs.stamp }},enable=${{ github.event_name != 'push' }}
          labels: |
            org.opencontainers.image.version=${{ needs.source.outputs.version }}
            org.opencontainers.image.revision=${{ steps.rev.outputs.sha }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          pull: true
          no-cache: ${{ needs.source.outputs.patch == 'true' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Build and push Cast sender
        id: build-cast
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.cast
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-cast.outputs.tags }}
          labels: ${{ steps.meta-cast.outputs.labels }}
          pull: true
          no-cache: ${{ needs.source.outputs.patch == 'true' }}
          cache-from: type=gha,scope=cast
          cache-to: type=gha,mode=max,scope=cast
          provenance: mode=max
          sbom: true

      # One scan, of fixable HIGH and CRITICAL findings, which the report and the gate below both read. It was two,
      # and the second re-read the whole image for a subset of what the first had already found.
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          version: v0.74.0
          format: json
          output: trivy.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Scan Cast image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.CAST_IMAGE }}@${{ steps.build-cast.outputs.digest }}
          version: v0.74.0
          format: json
          output: trivy-cast.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      # Report: those findings go to the repository's code scanning. Advisory — it never fails the job.
      - name: Report for code scanning
        continue-on-error: true
        run: trivy convert --format sarif --output trivy.sarif trivy.json

      - name: Upload scan to code scanning
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        continue-on-error: true
        with:
          sarif_file: trivy.sarif
          category: trivy-image

      - name: Report Cast scan for code scanning
        continue-on-error: true
        run: trivy convert --format sarif --output trivy-cast.sarif trivy-cast.json

      - name: Upload Cast scan to code scanning
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        continue-on-error: true
        with:
          sarif_file: trivy-cast.sarif
          category: trivy-cast-image

      # A CRITICAL with a fixed version available fails here, before anything is signed or :latest moves.
      # Unfixed CVEs were already dropped by the scan above. A patch rebuild gates on OS packages only — the
      # part a rebuild can fix; a vulnerable crate needs a release, and holding back a musl or toolchain fix
      # until then would leave the box worse off.
      - name: Scan gate
        env:
          PATCH: ${{ needs.source.outputs.patch }}
        run: |
          set -euo pipefail
          if [ "$PATCH" = true ]; then
            jq '.Results |= map(select(.Class == "os-pkgs"))' trivy.json > gate.json
            jq '.Results |= map(select(.Class == "os-pkgs"))' trivy-cast.json > gate-cast.json
          else
            cp trivy.json gate.json
            cp trivy-cast.json gate-cast.json
          fi
          trivy convert --severity CRITICAL --exit-code 1 --format table gate.json
          trivy convert --severity CRITICAL --exit-code 1 --format table gate-cast.json

  # Sign and move :latest only once the image passed its scan gate AND the tagged commit passed CI.
  release:
    needs: [source, ci, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.ci.result == 'success' || needs.ci.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write         # keyless cosign: the signing certificate is issued to this workflow's OIDC identity
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
          CAST_DIGEST: ${{ needs.build.outputs.cast_digest }}
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign sign --yes "$CAST_IMAGE@$CAST_DIGEST"

      # :latest is what den-update deploys, so it moves last, to exactly the digest that was scanned and signed.
      - name: Point :latest at the signed image
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
          CAST_DIGEST: ${{ needs.build.outputs.cast_digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$DIGEST"
          moved=$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{json .Manifest}}' | jq -r .digest)
          test "$moved" = "$DIGEST" || { echo "::error::latest resolved to $moved, not the signed $DIGEST"; exit 1; }
          docker buildx imagetools create --tag "$CAST_IMAGE:latest" "$CAST_IMAGE@$CAST_DIGEST"
          moved=$(docker buildx imagetools inspect "$CAST_IMAGE:latest" --format '{{json .Manifest}}' | jq -r .digest)
          test "$moved" = "$CAST_DIGEST" || { echo "::error::Cast latest resolved to $moved, not the signed $CAST_DIGEST"; exit 1; }
