name: player switch soak

# Wall-clock playback behavior needs real media time. Keep it out of the release gate, but exercise every soak
# weekly and on demand so that the coverage is not lost.
on:
  schedule:
    - cron: "17 4 * * 0"
  workflow_dispatch:

concurrency:
  group: player-switch-soak-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps webkit
      - run: npm run test:e2e:soak
