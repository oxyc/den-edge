name: tizen3

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Check the JavaScript policy against the vendored fixtures
        run: node scripts/tizen3-core.integration.mjs
      - name: Run the packaged viewer journeys without modern engine globals
        env:
          DEN_TIZEN_VERSION: "3.0"
          DEN_TV_OLD_ENGINE_LIMITS: "1"
        run: npm run test:e2e:tv-package
      - name: Run the big-library journeys at phone-speed CPU
        run: npm run test:e2e:budgets
