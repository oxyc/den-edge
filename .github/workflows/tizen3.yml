name: tizen3

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    # This is a hard timing gate; pin the host and browsers instead of measuring whichever image `latest` selects.
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Verify Playwright image matches the lockfile
        run: |
          version=$(node -p "require('./node_modules/@playwright/test/package.json').version")
          test "$version" = 1.64.1 || {
            echo "::error::Playwright $version does not match mcr.microsoft.com/playwright:v1.64.1-noble"
            exit 1
          }
          node --input-type=module -e "import { chromium, webkit } from '@playwright/test'; import { existsSync } from 'node:fs'; for (const browser of [chromium, webkit]) if (!existsSync(browser.executablePath())) throw new Error('browser missing: ' + browser.executablePath())"
      - name: Check the JavaScript policy against the vendored fixtures
        run: node scripts/tizen3-core.integration.mjs
      - name: Run the packaged viewer journeys without modern engine globals
        env:
          DEN_TIZEN_VERSION: "3.0"
          DEN_TV_OLD_ENGINE_LIMITS: "1"
        run: npm run test:e2e:tv-package
      - name: Run the big-library journeys at phone-speed CPU
        id: budgets
        continue-on-error: true
        run: npm run test:e2e:budgets
      - name: Report exceeded timing budgets
        if: steps.budgets.outcome == 'failure'
        run: echo "::warning title=Timing budgets exceeded::Performance budgets are advisory; inspect the retained evidence."
      - name: Retain budget failure evidence
        if: steps.budgets.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tizen3-budget-failures
          path: web/test-results
          if-no-files-found: ignore
          retention-days: 7
