[package]
name = "den-edge"
version = "0.31.1"
edition = "2021"
description = "Den's sync relay on the homelab: pairing, the sealed inbox, the library's record log, and the Den web app."
license = "MIT"
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "signal", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
getrandom = "0.4"
url = "2"

# Small static binary, like every den addon.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
# Unwind (not abort): a stray panic in a request task drops that one connection instead of taking the
# process down.
