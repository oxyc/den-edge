[package]
name = "den-edge"
version = "0.184.0"
edition = "2021"
description = "Den's sync relay on the homelab: pairing, the sealed inbox, the library's record log, and the Den web app."
license = "MIT"
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "signal", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
getrandom = "0.4"
url = "2"
# The addon relay's client (`relay.rs`); both already come with axum.
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
# The web app's files are streamed from disk (`web.rs`); axum already depends on it.
http-body = "1"
# TMDB through this origin (`tmdb.rs`) is the only thing den-edge fetches from outside the LAN, so it is the
# only thing needing TLS. `ring` rather than aws-lc-rs (no C toolchain), and the roots compiled in rather than
# read from the OS, which a `scratch` image has none of.
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "tls12", "webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Gzip for the library's sync pages (`library.rs`): mostly base64 ciphertext, which it still cuts by a quarter.
flate2 = "1"
# Signs the MCP connector's access tokens (`oauth.rs`), which den-mcp checks with the public key alone. Pure Rust.
ed25519-dalek = { version = "3", default-features = false, features = ["fast", "zeroize"] }

# Small static binary, like every den addon.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
# Unwind (not abort): a stray panic in a request task drops that one connection instead of taking the
# process down.
